# Servidor
server.port=8080

# H2 Database - arquivo local persistente
spring.datasource.url=jdbc:h2:file:./data/dashboard-financeiro;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (acessivel em /h2-console durante o desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Seed de dados iniciais (ativado apenas quando necessario - ver Fase 7)
spring.sql.init.mode=never
