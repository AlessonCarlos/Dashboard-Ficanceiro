<div class="pagina">
  <div class="cabecalho">
    <h2>{{ id ? 'Editar categoria' : 'Nova categoria' }}</h2>
  </div>

  <p *ngIf="erro" class="mensagem-erro">{{ erro }}</p>

  <form class="formulario" [formGroup]="form" (ngSubmit)="salvar()">
    <div class="campo">
      <label for="nome">Nome</label>
      <input id="nome" type="text" formControlName="nome" placeholder="Ex: Combustivel, Corrida Uber" />
      <span class="campo-erro" *ngIf="form.get('nome')?.touched && form.get('nome')?.invalid">
        Informe o nome da categoria.
      </span>
    </div>

    <div class="campo">
      <label for="tipo">Tipo</label>
      <select id="tipo" formControlName="tipo">
        <option value="GANHO">Ganho</option>
        <option value="CUSTO">Custo</option>
      </select>
    </div>

    <div class="acoes-formulario">
      <button type="submit" class="botao-primario" [disabled]="salvando">Salvar</button>
      <a routerLink="/categorias" class="botao-secundario">Cancelar</a>
    </div>
  </form>
</div>
