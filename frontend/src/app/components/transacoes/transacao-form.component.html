<div class="pagina">
  <div class="cabecalho">
    <h2>{{ id ? 'Editar transacao' : 'Nova transacao' }}</h2>
  </div>

  <p *ngIf="erro" class="mensagem-erro">{{ erro }}</p>

  <form class="formulario" [formGroup]="form" (ngSubmit)="salvar()">
    <div class="campo">
      <label for="tipo">Tipo</label>
      <select id="tipo" formControlName="tipo">
        <option value="GANHO">Ganho</option>
        <option value="CUSTO">Custo</option>
      </select>
    </div>

    <div class="campo">
      <label for="descricao">Descricao</label>
      <input id="descricao" type="text" formControlName="descricao" placeholder="Ex: Corrida Uber, Recarga" />
      <span class="campo-erro" *ngIf="form.get('descricao')?.touched && form.get('descricao')?.invalid">
        Informe uma descricao.
      </span>
    </div>

    <div class="campo">
      <label for="valor">Valor (R$)</label>
      <input id="valor" type="number" step="0.01" formControlName="valor" />
    </div>

    <div class="campo">
      <label for="data">Data</label>
      <input id="data" type="date" formControlName="data" />
    </div>

    <div class="campo">
      <label for="contaId">Conta</label>
      <select id="contaId" formControlName="contaId">
        <option [ngValue]="null" disabled>Selecione uma conta</option>
        <option *ngFor="let conta of contas" [ngValue]="conta.id">{{ conta.nome }}</option>
      </select>
      <span class="campo-erro" *ngIf="form.get('contaId')?.touched && form.get('contaId')?.invalid">
        Selecione a conta.
      </span>
    </div>

    <div class="campo">
      <label for="categoriaId">Categoria</label>
      <select id="categoriaId" formControlName="categoriaId">
        <option [ngValue]="null" disabled>Selecione uma categoria</option>
        <option *ngFor="let categoria of categorias" [ngValue]="categoria.id">{{ categoria.nome }}</option>
      </select>
      <span class="campo-erro" *ngIf="form.get('categoriaId')?.touched && form.get('categoriaId')?.invalid">
        Selecione a categoria.
      </span>
    </div>

    <div class="campo">
      <label for="veiculoId">Veiculo (opcional, so para custos do carro)</label>
      <select id="veiculoId" formControlName="veiculoId">
        <option [ngValue]="null">Nenhum</option>
        <option *ngFor="let veiculo of veiculos" [ngValue]="veiculo.id">{{ veiculo.modelo }} - {{ veiculo.placa }}</option>
      </select>
    </div>

    <div class="acoes-formulario">
      <button type="submit" class="botao-primario" [disabled]="salvando">Salvar</button>
      <a routerLink="/transacoes" class="botao-secundario">Cancelar</a>
    </div>
  </form>
</div>
